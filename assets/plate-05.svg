<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460" role="img" aria-label="Plate 05 - off the terminal: portrait photography as Sora (thesora.io), inline speed skating, the Mahabharata in Tamil retellings."><style>@font-face{font-family:'Instrument Serif';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}@font-face{font-family:'Geist Mono';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}@font-face{font-family:'Inter';src:url(data:font/woff2;base64,) format('woff2');font-weight:400;font-style:normal;}
text{font-variant-numeric:tabular-nums;}
.r{opacity:0;animation:rise 1.4s cubic-bezier(.16,1,.3,1) forwards;}
.rs{opacity:0;animation:rise .55s cubic-bezier(.25,.46,.45,.94) forwards;}
@keyframes rise{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:none;}}
@keyframes rise-s{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}
.d4{animation-delay:.24s}.d5{animation-delay:.30s}.d6{animation-delay:.36s}
.d7{animation-delay:.42s}.d8{animation-delay:.48s}
@media (prefers-reduced-motion:reduce){*{animation:none !important;opacity:1 !important;transform:none !important;}}
</style><rect width="1080" height="460" fill="#efedea"/><text x="52.0" y="46.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#0a0a0a" letter-spacing="0.25" class="rs d1" opacity="0.78">PLATE FIVE CARRIES</text><text x="52.0" y="64.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#0a0a0a" letter-spacing="0.25" class="rs d1" opacity="0.78">NO DIAGRAM.</text><text x="1028.0" y="46.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#0a0a0a" letter-spacing="1.00" text-anchor="end" class="rs d1" opacity="0.9">UDAYA VIJAY ANAND</text><text x="1028.0" y="64.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#0a0a0a" letter-spacing="1.00" text-anchor="end" class="rs d2" opacity="0.9">NEW YORK, NY</text><text x="1028.0" y="82.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#1e2edc" letter-spacing="1.00" text-anchor="end" class="rs d3" opacity="1">PLATE 05 / 06</text><text x="52.0" y="168.0" font-family="'Instrument Serif',Georgia,serif" font-size="50" letter-spacing="-0.75" class="r d2"><tspan fill="#0a0a0a">off the terminal, </tspan><tspan fill="#1e2edc">I photograph people.</tspan></text><text x="52.0" y="226.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="18.5" fill="#0a0a0a" class="rs d3" opacity="0.85">A portrait practice called Sora — Sony A7III, almost always the 85mm.</text><text x="675.5" y="226.0" font-family="'Geist Mono','Courier New',monospace" font-size="12.5" fill="#1e2edc" letter-spacing="0.75" class="rs d4">THESORA.IO</text><text x="52.0" y="267.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="18.5" fill="#0a0a0a" class="rs d4" opacity="0.85">I was a competitive inline speed skater in India; New York is where</text><text x="52.0" y="298.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="18.5" fill="#0a0a0a" class="rs d5" opacity="0.85">I’m slowly finding my way back to it.</text><text x="52.0" y="339.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="18.5" fill="#0a0a0a" class="rs d6" opacity="0.85">And a long-running fascination with the Mahabharata,</text><text x="52.0" y="370.0" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-size="18.5" fill="#0a0a0a" class="rs d7" opacity="0.85">especially the Tamil retellings.</text><rect x="0.5" y="0.5" width="1079" height="459" fill="none" stroke="#0a0a0a" stroke-opacity="0.14"/></svg>